<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0b0f19;border-radius:12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;overflow:hidden;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#020617" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Filters for glows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    /* Dynamic pulsing and flow animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }
    @keyframes floatCard1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCard2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes barGrow {
      0%, 100% { height: 35px; y: 245px; }
      50% { height: 60px; y: 220px; }
    }
    .pulsing-orb {
      transform-origin: center;
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .flowing-line {
      stroke-dasharray: 8, 8;
      animation: dash 2s linear infinite;
    }
    .floating-card-1 {
      animation: floatCard1 4s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: floatCard2 5s ease-in-out infinite;
    }
    .bar-anim {
      animation: barGrow 3s ease-in-out infinite;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bgGlow)" />

  <!-- Animated Ambient Orbs in the background -->
  <circle class="pulsing-orb" cx="180" cy="100" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" />
  <circle class="pulsing-orb" cx="1020" cy="220" r="160" fill="#a855f7" opacity="0.14" filter="url(#glow)" />
  <circle class="pulsing-orb" cx="600" cy="300" r="120" fill="#06b6d4" opacity="0.1" filter="url(#glow)" />

  <!-- Grid Pattern Overlay for Tech Fintech Aesthetic -->
  <g opacity="0.15" stroke="#334155" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Background Animated Flow Lines (Lending Pipeline / Credit rails) -->
  <g opacity="0.35">
    <path class="flowing-line" d="M -50,300 C 300,320 400,160 700,200 C 950,230 1050,110 1250,120" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="flowing-line" d="M -50,260 C 250,280 450,120 750,160 C 1000,190 1100,70 1250,80" fill="none" stroke="#a855f7" stroke-width="1.8" />
  </g>

  <!-- Side Illustrative Cards (Dynamic Floating Badges on right side) -->
  <g class="floating-card-1" opacity="0.95">
    <rect x="910" y="55" width="230" height="95" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="940" cy="90" r="16" fill="#10b981" fill-opacity="0.2" />
    <text x="940" y="96" fill="#10b981" font-size="16" font-weight="bold" text-anchor="middle">✓</text>
    <text x="968" y="86" fill="#f8fafc" font-size="13" font-weight="700">Instant Underwriting</text>
    <text x="968" y="104" fill="#94a3b8" font-size="11">Embedded Revenue Split</text>
    <rect x="968" y="118" width="130" height="4" rx="2" fill="#334155" />
    <rect x="968" y="118" width="95" height="4" rx="2" fill="#10b981" />
  </g>

  <g class="floating-card-2" opacity="0.95">
    <rect x="880" y="185" width="260" height="110" rx="14" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="905" y="217" fill="#f8fafc" font-size="13" font-weight="700">Automated Loan Servicing</text>
    <text x="905" y="235" fill="#94a3b8" font-size="11">Frappe Lending • Apache Fineract</text>
    <!-- Mini dynamic bars -->
    <rect x="905" y="255" width="16" height="25" rx="3" fill="#38bdf8" opacity="0.8" />
    <rect x="928" y="245" width="16" height="35" rx="3" fill="#818cf8" opacity="0.8" />
    <rect class="bar-anim" x="951" y="235" width="16" height="45" rx="3" fill="#10b981" opacity="0.9" />
    <rect x="974" y="250" width="16" height="30" rx="3" fill="#c084fc" opacity="0.8" />
    <rect x="997" y="240" width="16" height="40" rx="3" fill="#f59e0b" opacity="0.8" />
    <text x="1035" y="268" fill="#38bdf8" font-size="14" font-weight="bold">+48.2%</text>
  </g>

  <!-- Main Content in Crisp Clear Foreground (Guaranteed Unobscured) -->
  <g transform="translate(80, 0)">
    <!-- Pill Badge -->
    <rect x="0" y="45" width="275" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2" />
    <circle cx="15" cy="60" r="5" fill="#10b981" />
    <text x="28" y="65" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1">CURATED FINTECH ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="145" fill="url(#primaryGrad)" font-size="44" font-weight="900" letter-spacing="-1.5">Awesome Small Business</text>
    <text x="0" y="195" fill="#ffffff" font-size="44" font-weight="900" letter-spacing="-1.5">Lending <tspan fill="#38bdf8">Fintech</tspan></text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="240" fill="#94a3b8" font-size="16" font-weight="400" letter-spacing="0.2">
      Revenue-Based Financing • Embedded Lending APIs • Core Loan Management Systems
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 275)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="115" height="28" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="14" y="18" fill="#e2e8f0" font-size="12" font-weight="600">⚡ SaaS Platforms</text>

      <!-- Tag 2 -->
      <rect x="125" y="0" width="145" height="28" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="139" y="18" fill="#e2e8f0" font-size="12" font-weight="600">🔓 Open-Source LOS</text>

      <!-- Tag 3 -->
      <rect x="280" y="0" width="130" height="28" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="294" y="18" fill="#e2e8f0" font-size="12" font-weight="600">📊 Market Analysis</text>

      <!-- Tag 4 -->
      <rect x="420" y="0" width="140" height="28" rx="7" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="434" y="18" fill="#e2e8f0" font-size="12" font-weight="600">💳 Embedded Rails</text>
    </g>
  </g>
</svg>
